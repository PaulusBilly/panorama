<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'none'; media-src 'none'" />
    <title>Panorama Native Playback Spike</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; background: transparent; color: white; font: 16px Arial, sans-serif; overflow: hidden; }
      body { position: relative; }
      [data-video-surface] { position: absolute; inset: 48px; background: #111; }
      main { position: absolute; z-index: 2; left: 50%; bottom: 72px; transform: translateX(-50%); width: min(720px, calc(100% - 96px)); padding: 18px; background: rgb(0 0 0 / 78%); border: 1px solid rgb(255 255 255 / 35%); }
      button { min-height: 44px; padding: 0 20px; color: white; border: 1px solid white; background: transparent; }
      input[type="range"] { display: block; width: 100%; margin: 18px 0; }
      pre { max-height: 160px; overflow: auto; }
    </style>
  </head>
  <body>
    <div data-video-surface aria-hidden="true"></div>
    <main>
      <p data-status>Native host unavailable</p>
      <button type="button" data-play>Play</button>
      <button type="button" data-pause>Pause</button>
      <label>Focus test <input type="range" min="0" max="100" value="30" /></label>
      <pre data-diagnostics></pre>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
