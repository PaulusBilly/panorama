[workspace]
resolver = "3"
members = ["crates/panorama-core", "crates/panorama-app"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui-component = "=0.7.1"
# font-kit: without it macOS falls back to a no-op text system and renders no text.
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
