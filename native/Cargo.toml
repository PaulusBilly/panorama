[workspace]
resolver = "3"
members = ["crates/panorama-core", "crates/panorama-app", "crates/panorama-mpv", "spikes/gate1-video", "spikes/gate3-core", "spikes/gate6-torrent"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
stremio-core = { git = "https://github.com/Stremio/stremio-core", rev = "474ffaa42e0b7b9bcba0dd99368c41e828579dec", features = ["derive", "env-future-send"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
futures = "=0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
url = "=2.5.8"
http = "=1.5.0"
chrono = "=0.4.45"
tracing = "=0.1.44"
tiny_http = "=0.12.0"
rcgen = "=0.14.7"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
libloading = "=0.8.9"
raw-window-handle = "=0.6.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tempfile = "=3.27.0"
sha2 = "=0.10.9"
getrandom = "=0.3.4"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
httpdate = "=1.0.3"
fs4 = { version = "=0.13.1", default-features = false, features = ["sync"] }
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
cap-std = "=4.0.3"
cap-primitives = "=4.0.3"
same-file = "=1.0.6"
anyhow = "=1.0.104"
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui-component = "=0.7.1"
# font-kit: without it macOS falls back to a no-op text system and renders no text.
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

# stremio-core's bitfield crate pins flate2 to 1.0.x, which conflicts with GPUI. See vendor/README.md.
[patch."https://github.com/Stremio/stremio-core"]
stremio-watched-bitfield = { path = "vendor/stremio-watched-bitfield" }
