[workspace]
resolver = "3"
members = ["crates/panorama-core", "crates/panorama-app", "spikes/gate1-video", "spikes/gate3-core", "spikes/gate6-torrent"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tempfile = "=3.27.0"
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "test-util"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
http = "=1.5.0"
bytes = "=1.12.1"
futures = "=0.3.34"
getrandom = "=0.3.4"
cap-std = "=4.0.3"
cap-primitives = "=4.0.3"
same-file = "=1.0.6"
fs4 = { version = "=0.13.1", default-features = false, features = ["sync"] }
url = "=2.5.8"
anyhow = "=1.0.104"
tracing = "=0.1.44"
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui-component = "=0.7.1"
# font-kit: without it macOS falls back to a no-op text system and renders no text.
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

# stremio-core's bitfield crate pins flate2 to 1.0.x, which conflicts with GPUI. See vendor/README.md.
[patch."https://github.com/Stremio/stremio-core"]
stremio-watched-bitfield = { path = "vendor/stremio-watched-bitfield" }
