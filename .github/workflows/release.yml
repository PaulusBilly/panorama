name: Release

# Pushing a version tag (v0.1.3) builds the Windows installer with Velopack and publishes it as
# that tag's GitHub Release, with the update feed installed copies of Panorama check.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tag matches the app version
        shell: pwsh
        run: |
          $version = (Select-String -Path crates/panorama-app/Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version" }
      - run: rustup toolchain install
      # No build cache: this job can write releases, so it builds from scratch.
      - run: dotnet tool install -g vpk --version 1.3.39-g8d2844f
      - name: Build and publish
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pwsh scripts/package-windows-installer.ps1 -Publish
