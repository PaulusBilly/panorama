[package]
name = "gate3-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
stremio-core = { git = "https://github.com/Stremio/stremio-core", rev = "474ffaa42e0b7b9bcba0dd99368c41e828579dec", features = ["derive", "env-future-send"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
http = "1"
chrono = "0.4"

[dev-dependencies]
tiny_http = "0.12"

[lints]
workspace = true
