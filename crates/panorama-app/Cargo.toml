[package]
name = "panorama-app"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "panorama"
path = "src/main.rs"

[dependencies]
panorama-core = { path = "../panorama-core" }
panorama-mpv = { path = "../panorama-mpv" }
tokio.workspace = true
futures.workspace = true
image.workspace = true
url.workspace = true
serde_json.workspace = true
raw-window-handle = "=0.6.2"
png = "=0.18.1"
gpui.workspace = true
gpui-component.workspace = true
gpui-platform.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation"] }

[lints]
workspace = true
